<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive vanilla JavaScript image slider demo">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">VANILLA JAVASCRIPT COMPONENT</p>
      <h1>Image Slider Library</h1>
      <p class="subtitle">A responsive, looping slider built with HTML, CSS, and modern JavaScript.</p>
    </header>

    <section class="slider" aria-label="Featured photographs">
      <div class="slider__viewport">
        <div class="slider__track">
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
              alt="Mountain lake surrounded by green hills">
            <figcaption class="slide__caption"><span>01 / LANDSCAPES</span><strong>Quiet places, wide horizons</strong>
            </figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
              alt="Sunlit landscape with rolling hills">
            <figcaption class="slide__caption"><span>02 / OUTDOORS</span><strong>Find a new perspective</strong>
            </figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=85"
              alt="Golden sunrise over a misty field">
            <figcaption class="slide__caption"><span>03 / SUNRISE</span><strong>Start with a little wonder</strong>
            </figcaption>
          </figure>
          <figure class="slide">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
              alt="Sunlight shining through a forest">
            <figcaption class="slide__caption"><span>04 / FORESTS</span><strong>Take the scenic route</strong>
            </figcaption>
          </figure>
        </div>
      </div>
      <button class="slider__arrow slider__arrow--prev" type="button" aria-label="Previous slide">‹</button>
      <button class="slider__arrow slider__arrow--next" type="button" aria-label="Next slide">›</button>
      <div class="slider__dots" aria-label="Choose a slide"></div>
      <p class="slider__status" aria-live="polite">Slide 1 of 4</p>
    </section>
    <footer><span>Responsive by design</span><span>HTML · CSS · JavaScript</span></footer>
  </main>
</body>

</html>
